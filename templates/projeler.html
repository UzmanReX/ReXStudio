<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Projeler - UzmanReX</title>

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial;
    background:#050510;
    color:white;

    overflow-x:hidden;

    padding-top:90px;
}

/* 🌌 NEON BACKGROUND */
.bg{
    position:fixed;

    width:500px;
    height:500px;

    border-radius:50%;

    filter:blur(140px);

    opacity:0.25;

    z-index:-2;

    animation:move 12s infinite alternate ease-in-out;
}

.bg1{
    background:cyan;
    top:-150px;
    left:-150px;
}

.bg2{
    background:#ff00ff;
    bottom:-150px;
    right:-150px;

    animation-delay:2s;
}

.bg3{
    background:yellow;
    top:40%;
    left:30%;

    animation-delay:4s;
}

@keyframes move{

    0%{
        transform:translate(0,0) scale(1);
    }

    100%{
        transform:translate(150px,100px) scale(1.3);
    }

}

/* 🌠 PARÇACIKLAR */
.particles{
    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    overflow:hidden;

    z-index:-3;
}

.particle{
    position:absolute;

    width:4px;
    height:4px;

    background:cyan;

    border-radius:50%;

    opacity:0.7;

    box-shadow:0 0 10px cyan;

    animation:floatParticle linear infinite;
}

@keyframes floatParticle{

    from{
        transform:translateY(100vh);
    }

    to{
        transform:translateY(-10vh);
    }

}

/* NAVBAR */
.navbar{
    position:fixed;
    top:0;
    left:0;

    width:100%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:18px 40px;

    background:rgba(10,10,20,0.85);

    backdrop-filter:blur(12px);

    border-bottom:1px solid cyan;

    z-index:1000;
}

/* LOGO */
.logo{

    display:flex;
    align-items:center;
    gap:12px;

    font-size:28px;
    font-weight:bold;

    color:cyan;

    text-shadow:0 0 15px cyan;
}

.logo img{

    width:40px;
    height:40px;

    border-radius:10px;

    box-shadow:
    0 0 10px cyan,
    0 0 20px cyan;
}

/* MENU */
.menu{
    display:flex;
    align-items:center;
    gap:20px;
}

.menu a{
    color:white;

    text-decoration:none;

    padding:8px 15px;

    border-radius:10px;

    transition:0.3s;
}

.menu a:hover{
    color:cyan;

    background:rgba(0,255,255,0.1);

    box-shadow:0 0 15px cyan;
}

/* 🔴 YOUTUBE */
.yt-btn{
    display:flex;
    align-items:center;
    gap:8px;

    color:red !important;

    font-weight:bold;

    border:1px solid red;

    box-shadow:
    0 0 10px red,
    0 0 20px red;

    animation:ytGlow 1.5s infinite alternate;
}

.yt-btn img{
    width:22px;
    height:22px;
}

.yt-btn:hover{

    transform:scale(1.08);

    background:rgba(255,0,0,0.1);

    box-shadow:
    0 0 20px red,
    0 0 40px red;
}

@keyframes ytGlow{

    0%{
        box-shadow:
        0 0 10px red,
        0 0 20px red;
    }

    100%{
        box-shadow:
        0 0 20px red,
        0 0 40px red;
    }

}

/* İÇERİK */
.container{

    width:100%;
    max-width:1200px;

    margin:auto;

    padding:100px 20px;

    text-align:center;
}

/* BAŞLIK */
.container h1{

    font-size:60px;

    color:cyan;

    text-shadow:
    0 0 15px cyan,
    0 0 35px cyan;
}

/* PROJE KARTLARI */
.projects{

    display:flex;

    justify-content:center;

    gap:40px;

    flex-wrap:wrap;

    margin-top:60px;
}

.project-card{

    width:340px;

    background:#111122;

    border-radius:25px;

    padding:30px;

    border:1px solid rgba(255,255,255,0.1);

    transition:0.4s;
}

.project-card:hover{

    transform:translateY(-10px) scale(1.03);

    border:1px solid yellow;

    box-shadow:
    0 0 20px yellow,
    0 0 40px yellow;
}

/* SARI BUTON */
.dev-btn{

    display:inline-block;

    margin-top:20px;

    padding:14px 25px;

    background:rgba(255,255,0,0.1);

    color:yellow;

    border:1px solid yellow;

    border-radius:14px;

    font-weight:bold;

    text-decoration:none;

    transition:0.3s;

    box-shadow:
    0 0 10px yellow,
    0 0 20px rgba(255,255,0,0.5);
}

.dev-btn:hover{

    transform:scale(1.08);

    background:yellow;

    color:black;

    box-shadow:
    0 0 25px yellow,
    0 0 50px yellow;
}

.project-card h2{

    margin-bottom:20px;

    color:white;

    font-size:30px;
}

.project-card p{

    color:#bbb;

    line-height:1.7;

    margin-top:15px;
}

.status{

    margin-top:20px;

    color:lime;

    font-weight:bold;

    text-shadow:
    0 0 10px lime;
}

</style>

</head>

<body>

<!-- 🌌 BACKGROUND -->
<div class="bg bg1"></div>
<div class="bg bg2"></div>
<div class="bg bg3"></div>

<!-- 🌠 PARTICLES -->
<div class="particles" id="particles"></div>

<!-- NAVBAR -->
<nav class="navbar">

<div class="logo">

<img src="/static/rexlogo.png">

<span>UzmanReX</span>

</div>

<div class="menu">

<a href="/">Ana Sayfa</a>

<a href="/uygulamalar">Uygulamalar</a>

<a href="/projeler">Projeler</a>

<a href="/destek">İletişim</a>

<a class="yt-btn"
href="http://www.youtube.com/@UzmanReX"
target="_blank">

<img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png">

YouTube

</a>

</div>

</nav>

<!-- İÇERİK -->
<div class="container">

<h1>Projeler</h1>

<div class="projects">

<!-- PROJE -->
<div class="project-card">

<h2>⏱ Kronometre</h2>

<a class="dev-btn" href="#">
Yapım Aşamasında Olan Uygulama
</a>

<p>
Modern tasarımlı gelişmiş kronometre.
</p>

<div class="status">
⚡ Geliştiriliyor...
</div>

</div>

</div>

</div>

<!-- JS -->
<script>

const particles = document.getElementById("particles");

for(let i = 0; i < 120; i++){

    let p = document.createElement("div");

    p.classList.add("particle");

    p.style.left =
    Math.random() * 100 + "vw";

    p.style.animationDuration =
    (4 + Math.random() * 8) + "s";

    p.style.opacity =
    Math.random();

    p.style.width =
    p.style.height =
    (2 + Math.random() * 5) + "px";

    particles.appendChild(p);
}

</script>

</body>

</html>
