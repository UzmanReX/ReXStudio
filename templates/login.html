<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<title>ReXStudio - Giriş Yap</title>

<link rel="icon" type="image/png" href="/static/rexlogo.png">

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#050510;
    color:white;
    font-family:Arial;
}

.box{
    background:#111122;
    padding:40px;
    border:2px solid cyan;
    box-shadow:0 0 20px cyan;
    border-radius:15px;
    text-align:center;
}

input{
    width:220px;
    padding:10px;
    margin:10px;
    border:none;
    border-radius:8px;
}

button{
    padding:10px 20px;
    background:cyan;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.error{
    color:#ff4d4d;
    margin:15px 0;
    font-weight:bold;
}

.success{
    color:#00ff88;
    margin:15px 0;
    font-weight:bold;
}

.info{
    color:#bbb;
    font-size:13px;
    margin:10px 0 15px;
    line-height:1.5;
}

.remember{
    width:auto;
    margin:10px 5px 10px 0;
}

.link{
    display:block;
    margin-top:20px;
    color:cyan;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="box">

<h2>Gmail ile Giriş</h2>

<p class="info">
Giriş kodu <strong>rexstudiosupport@gmail.com</strong>
tarafından gönderilecektir.
</p>

{% if error %}
<div class="error">
{{ error }}
</div>
{% endif %}

{% if success %}
<div class="success">
{{ success }}
</div>
{% endif %}

<form method="POST">

<input
    type="text"
    name="username"
    placeholder="Kullanıcı Adı"
    required
>

<br>

<input
    type="email"
    name="email"
    placeholder="Gmail"
    required
>

<br>

<label>

<input
    class="remember"
    type="checkbox"
    name="remember"
>

Beni Hatırla

</label>

<br>

<button type="submit">
Kod Gönder
</button>

</form>

<a class="link" href="/kayit">
Hesabın yok mu? Kayıt Ol
</a>

</div>

</body>

</html>
