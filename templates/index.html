<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UzmanReX</title>

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial;
    background:#050510;
    color:white;

    overflow-x:hidden;

    padding-top:90px;
}

/* 🌌 NEON BACKGROUND */
.bg{
    position:fixed;

    width:500px;
    height:500px;

    border-radius:50%;

    filter:blur(140px);

    opacity:0.25;

    z-index:-2;

    animation:move 12s infinite alternate ease-in-out;
}

.bg1{
    background:cyan;
    top:-150px;
    left:-150px;
}

.bg2{
    background:#ff00ff;
    bottom:-150px;
    right:-150px;

    animation-delay:2s;
}

.bg3{
    background:yellow;
    top:40%;
    left:30%;

    animation-delay:4s;
}

@keyframes move{

    0%{
        transform:translate(0,0) scale(1);
    }

    100%{
        transform:translate(150px,100px) scale(1.3);
    }

}

/* 🌠 PARÇACIKLAR */
.particles{
    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    overflow:hidden;

    z-index:-3;
}

.particle{
    position:absolute;

    width:4px;
    height:4px;

    background:cyan;

    border-radius:50%;

    opacity:0.7;

    box-shadow:0 0 10px cyan;

    animation:floatParticle linear infinite;
}

@keyframes floatParticle{

    from{
        transform:translateY(100vh);
    }

    to{
        transform:translateY(-10vh);
    }

}

/* NAVBAR */
.navbar{
    position:fixed;
    top:0;
    left:0;

    width:100%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:18px 40px;

    background:rgba(10,10,20,0.85);

    backdrop-filter:blur(12px);

    border-bottom:1px solid cyan;

    z-index:1000;
}

/* LOGO */
.logo{

    display:flex;
    align-items:center;
    gap:12px;

    font-size:28px;
    font-weight:bold;

    color:cyan;

    text-shadow:0 0 15px cyan;
}

.logo img{

    width:40px;
    height:40px;

    border-radius:10px;

    box-shadow:
    0 0 10px cyan,
    0 0 20px cyan;
}

/* MENU */
.menu{
    display:flex;
    align-items:center;
    gap:20px;
}

.menu a{
    color:white;

    text-decoration:none;

    padding:8px 15px;

    border-radius:10px;

    transition:0.3s;
}

.menu a:hover{
    color:cyan;

    background:rgba(0,255,255,0.1);

    box-shadow:0 0 15px cyan;
}

/* 🔴 YOUTUBE */
.yt-btn{
    display:flex;
    align-items:center;
    gap:8px;

    color:red !important;

    font-weight:bold;

    border:1px solid red;

    box-shadow:
    0 0 10px red,
    0 0 20px red;

    animation:ytGlow 1.5s infinite alternate;
}

.yt-btn img{
    width:22px;
    height:22px;
}

.yt-btn:hover{

    transform:scale(1.08);

    background:rgba(255,0,0,0.1);

    box-shadow:
    0 0 20px red,
    0 0 40px red;
}

@keyframes ytGlow{

    0%{
        box-shadow:
        0 0 10px red,
        0 0 20px red;
    }

    100%{
        box-shadow:
        0 0 20px red,
        0 0 40px red;
    }

}

/* HERO */
.hero{

    min-height:80vh;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:20px;
}

.hero h1{

    font-size:80px;

    color:cyan;

    text-shadow:
    0 0 20px cyan,
    0 0 40px cyan;
}

.hero h2{

    margin-top:15px;

    font-size:35px;

    color:#ff00ff;

    text-shadow:
    0 0 15px #ff00ff;
}

.hero p{

    margin-top:20px;

    color:#bbb;

    font-size:20px;
}

/* KARTLAR */
.cards{

    display:flex;

    justify-content:center;

    gap:40px;

    flex-wrap:wrap;

    padding:40px;
}

.card{

    width:320px;

    background:#111122;

    border-radius:25px;

    padding:25px;

    transition:0.4s;

    border:1px solid rgba(255,255,255,0.1);
}

/* RGB CARD */
.rgb-card:hover{

    transform:translateY(-10px);

    animation:rgbBorder 2s linear infinite;

    box-shadow:
    0 0 20px red,
    0 0 20px blue,
    0 0 20px lime;
}

@keyframes rgbBorder{

    0%{
        border-color:red;
    }

    33%{
        border-color:lime;
    }

    66%{
        border-color:cyan;
    }

    100%{
        border-color:red;
    }

}

/* RED CARD */
.red-card:hover{

    transform:translateY(-10px);

    border:1px solid red;

    box-shadow:
    0 0 20px red,
    0 0 40px red;
}

.card h3{

    margin-bottom:15px;

    font-size:28px;
}

.card p{

    color:#bbb;

    line-height:1.6;
}

.card a{

    display:inline-block;

    margin-top:20px;

    padding:12px 25px;

    border-radius:12px;

    text-decoration:none;

    font-weight:bold;

    color:black;

    background:cyan;
}

.card a:hover{

    box-shadow:
    0 0 20px cyan,
    0 0 40px cyan;
}

</style>

</head>

<body>

<!-- 🌌 -->
<div class="bg bg1"></div>
<div class="bg bg2"></div>
<div class="bg bg3"></div>

<!-- 🌠 -->
<div class="particles" id="particles"></div>

<!-- NAVBAR -->
<nav class="navbar">

<div class="logo">

<img src="/static/rexlogo.png">

<span>UzmanReX</span>

</div>

<div class="menu">

<a href="/">Ana Sayfa</a>

<a href="/uygulamalar">Uygulamalar</a>

<a href="/projeler">Projeler</a>

<a href="/destek">İletişim</a>

<a class="yt-btn"
href="http://www.youtube.com/@UzmanReX"
target="_blank">

<img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png">

YouTube

</a>

</div>

</nav>

<!-- HERO -->
<section class="hero">

<h1>UzmanReX</h1>

<h2>ReX Studio</h2>

<p>
ReX Studio tarafından geliştirilen uygulamalar.
</p>

</section>

<!-- KARTLAR -->
<section class="cards">

<div class="card rgb-card">

<h3>UzmanNot Pro MAX💎</h3>

<p>
Gelişmiş özelliklere sahip premium not alma sistemi.

</p>

<a href="/uygulamalar">
İncele
</a>

</div>

<div class="card red-card">

<h3>Destek</h3>

<p>
ReX Studio ile iletişime geçin.
</p>

<a href="/destek">
Git
</a>

</div>

</section>

<!-- JS -->
<script>

const particles = document.getElementById("particles");

for(let i = 0; i < 120; i++){

    let p = document.createElement("div");

    p.classList.add("particle");

    p.style.left =
    Math.random() * 100 + "vw";

    p.style.animationDuration =
    (4 + Math.random() * 8) + "s";

    p.style.opacity =
    Math.random();

    p.style.width =
    p.style.height =
    (2 + Math.random() * 5) + "px";

    particles.appendChild(p);
}

</script>

</body>

</html>
