<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<title>ReXStudio - Hesabım</title>

<link rel="icon" type="image/png" href="/static/rexlogo.png">

<style>

body{
    margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#050510;
    color:white;
    font-family:Arial;
}

.box{
    background:#111122;

    padding:40px;

    width:380px;

    border:2px solid cyan;

    box-shadow:
    0 0 20px cyan;

    border-radius:15px;

    text-align:center;
}

.info{
    margin:20px 0;
    padding:15px;

    background:#080812;

    border-radius:10px;
}

.apps{
    margin-top:25px;
}

.app-item{
    margin-top:10px;
    padding:12px;

    background:#080812;

    border:1px solid cyan;

    border-radius:10px;
}

.button{
    display:inline-block;

    padding:10px 20px;

    margin-top:25px;

    background:cyan;

    color:black;

    border-radius:10px;

    text-decoration:none;
}

.logout{
    background:red;
}

</style>

</head>

<body>

<div class="box">

<h2>👤 Hesabım</h2>

<div class="info">

<strong>Kullanıcı Adı</strong>

<br>

{{ username }}

</div>

<div class="info">

<strong>Gmail</strong>

<br>

{{ email }}

</div>

<div class="apps">

<h3>📦 Yüklediğim Uygulamalar</h3>

{% if apps %}

{% for app in apps %}

<div class="app-item">

<strong>{{ app["name"] }}</strong>

{% if app["filename"] %}

<br>

{{ app["filename"] }}

{% endif %}

</div>

{% endfor %}

{% else %}

<p style="color:#aaa; margin-top:15px;">
Henüz uygulama yüklemediniz.
</p>

{% endif %}

</div>

<a class="button" href="/">
Ana Sayfa
</a>

<br>

<a class="button logout" href="/cikis">
Çıkış Yap
</a>

</div>

</body>

</html>
