<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>ReXStudio - Giriş Kodu</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#050510;
    color:white;
    font-family:Arial;
}

.box{
    background:#111122;
    padding:40px;
    border:2px solid cyan;
    box-shadow:0 0 20px cyan;
    border-radius:15px;
    text-align:center;
}

input{
    width:220px;
    padding:10px;
    margin:10px;
    border:none;
    border-radius:8px;
    text-align:center;
    font-size:20px;
    letter-spacing:5px;
}

button{
    padding:10px 20px;
    background:cyan;
    border:none;
    border-radius:10px;
    cursor:pointer;
}
</style>

</head>

<body>

<div class="box">

<h2>Giriş Kodu</h2>

<p>Gmail adresine gönderilen 6 haneli kodu gir.</p>

<form method="POST">

<input
    type="text"
    name="code"
    maxlength="6"
    inputmode="numeric"
    placeholder="000000"
    required
>

<br>

<button type="submit">Giriş Yap</button>

</form>

</div>

</body>
</html>
